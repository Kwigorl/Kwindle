# ==========================================================================
#  KoboaExpress : recevoir des livres par e-mail sur la Kobo
# ==========================================================================
# Les livres envoyés en pièce jointe à l'adresse ci-dessous arrivent sur la
# Kobo à chaque connexion Wi-Fi, dans le dossier KoboaExpress/Livres.
# Formats : EPUB, KEPUB, PDF, MOBI, CBZ, CBR, TXT, RTF, HTML.
#
# Les lignes qui commencent par # sont des explications : seules comptent
# les lignes « nom = valeur ».

# --- La boîte mail que la Kobo relève ---------------------------------------
# Conseil : une adresse Gmail rien que pour la Kobo (par ex. prenom.kobo@gmail.com).
adresse =

# Gmail demande un « mot de passe d'application » (16 lettres), pas le mot de
# passe habituel : active la validation en 2 étapes du compte Google, puis
# crée-le sur https://myaccount.google.com/apppasswords
mot_de_passe =

# Serveur IMAP : Gmail = imap.gmail.com, Orange = imap.orange.fr,
# Free = imap.free.fr, SFR = imap.sfr.fr, Laposte.net = imap.laposte.net
serveur = imap.gmail.com
port = 993

# --- Quels e-mails prendre ---------------------------------------------------
# Ne prendre que les e-mails envoyés à une adresse qui contient ce texte.
# Avec Gmail, les e-mails envoyés à prenom+kobo@gmail.com arrivent dans la
# boîte prenom@gmail.com : seuls ceux-là seront pris.
# Laisse vide si l'adresse sert uniquement à la Kobo (tous les e-mails sont pris).
filtre_adresse = +kobo

# ... et/ou dont l'objet contient ce texte (facultatif, par ex. Kobo)
filtre_objet =

# Après réception, l'e-mail est marqué comme lu. Mets « oui » pour le supprimer
# (avec Gmail, il est archivé dans « Tous les messages »).
supprimer_email = non

# --- Réglages avancés --------------------------------------------------------
# Dossier de la boîte mail à relever
dossier_imap = INBOX

# La première fois, KoboaExpress ne prend que les e-mails de ces derniers jours
jours_premiere_fois = 30

# Pour faire apparaître les nouveaux livres : auto (conseillé : NickelDBus s'il est
# installé, sinon bouton « KoboaExpress - importer les livres » de NickelMenu),
# usb (fenêtre « se connecter », déconseillé), non (rien)
actualisation = auto
