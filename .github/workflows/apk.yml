name: APK Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy a besoin d'un Python de la même version que celui embarqué (3.13)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: gradle/actions/setup-gradle@v4

      # deux saveurs : Rekindle (Kindle) et Koboa (Kobo)
      - name: Construire les APK
        run: ./gradlew assembleRekindleRelease assembleKoboaRelease --stacktrace

      - name: Renommer les APK
        run: |
          cp app/build/outputs/apk/rekindle/release/app-rekindle-release.apk ../Rekindle.apk
          cp app/build/outputs/apk/koboa/release/app-koboa-release.apk ../Koboa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            Rekindle.apk
            Koboa.apk
          retention-days: 30

      # Page de téléchargement stable : Releases › « Rekindle Android »
      - name: Publier la release « android »
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android Rekindle.apk \
            --title "Rekindle Android (build ${{ github.run_number }})" \
            --notes "APK compilé automatiquement depuis ${{ github.sha }}. Installe-le par-dessus la version précédente." \
            --latest
          gh release delete koboa --yes --cleanup-tag || true
          gh release create koboa Koboa.apk \
            --title "Koboa Android (build ${{ github.run_number }})" \
            --notes "Koboa : Rekindle pour les liseuses Kobo (avec KoboaExpress sur la Kobo). APK compilé depuis ${{ github.sha }}." \
            --latest=false

      # Copie des APK sur la branche « apk » (récupérable avec git)
      - name: Mettre les APK sur la branche apk
        working-directory: .
        run: |
          mkdir /tmp/branche-apk && cp Rekindle.apk Koboa.apk /tmp/branche-apk/ && cd /tmp/branche-apk
          git init -q && git checkout -q -b apk && git add Rekindle.apk Koboa.apk
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "APK build ${{ github.run_number }} (${{ github.sha }})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
